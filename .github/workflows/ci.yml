name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: epicoin
          POSTGRES_PASSWORD: epicoin
          POSTGRES_DB: epicoin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epicoin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The API integration tests create one throw-away database per test.
      DATABASE_URL: postgres://epicoin:epicoin@127.0.0.1:5432/epicoin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
