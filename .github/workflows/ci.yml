name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: epicoin
          POSTGRES_PASSWORD: epicoin
          POSTGRES_DB: epicoin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epicoin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The API integration tests create one throw-away database per test.
      DATABASE_URL: postgres://epicoin:epicoin@127.0.0.1:5432/epicoin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Front (lint, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [rust, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: epicoin
          POSTGRES_PASSWORD: epicoin
          POSTGRES_DB: epicoin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epicoin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_POSTGRES_URL: postgres://epicoin:epicoin@127.0.0.1:5432/epicoin
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
