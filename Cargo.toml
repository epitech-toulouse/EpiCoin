[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
epicoin-core = { path = "crates/epicoin-core" }
epicoin-node = { path = "crates/epicoin-node" }

anyhow = "1.0"
axum = "0.8"
blake3 = "1.8"
borsh = { version = "1.8", features = ["derive"] }
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = "3.0"
getrandom = "0.3"
hex = "0.4"
redb = "4.6"
# Plain HTTP only: services talk to each other on a private network.
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1.9"

proptest = "1.12"
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package."*"]
# Crypto and hashing are painfully slow unoptimized; keep our own crates in debug.
opt-level = 2
