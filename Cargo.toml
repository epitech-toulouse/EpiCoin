[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
epicoin-core = { path = "crates/epicoin-core" }

blake3 = "1.8"
borsh = { version = "1.8", features = ["derive"] }
ed25519-dalek = "3.0"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = "1.9"

proptest = "1.12"

[profile.dev.package."*"]
# Crypto and hashing are painfully slow unoptimized; keep our own crates in debug.
opt-level = 2
